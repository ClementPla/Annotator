name: "publish"

on:
  push:
    branches:
      - release

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

# The microscopy reader shipped with the app: a release of
# https://github.com/ClementPla/didascalie-bioformats (a separate GPL program,
# see THIRD_PARTY_NOTICES.md). Bump it together with the app when the reader's
# JSON protocol changes (`microscopy::PROTOCOL` in src-tauri).
env:
  READER_VERSION: v0.1.0

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
          - platform: "windows-latest"
            args: ""
            target: x86_64-pc-windows-msvc
          - platform: "ubuntu-22.04" # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ""
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sudo apt install -y --reinstall ca-certificates
          sudo update-ca-certificates -f
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.

      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.

      # Into src-tauri/binaries/, which src-tauri/tauri.microscopy.conf.json (merged
      # below with --config) bundles next to the application. That overlay is kept
      # out of tauri.conf.json so local and Android builds do not need the binary.
      - name: fetch the microscopy reader
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p src-tauri/binaries
          gh release download "$READER_VERSION" --repo ClementPla/didascalie-bioformats             --pattern "didascalie-bioformats-${{ matrix.target }}*" --dir src-tauri/binaries
          gh release download "$READER_VERSION" --repo ClementPla/didascalie-bioformats             --pattern LICENSE --output src-tauri/binaries/didascalie-bioformats-LICENSE.txt
          chmod +x src-tauri/binaries/didascalie-bioformats-* || true
          ls -l src-tauri/binaries

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Which CUDA the head's GPU backend is built against.
          #
          # cudarc derives the NVRTC DLL names it loads at *run* time from a
          # version baked in at *build* time, normally by running `nvcc
          # --version`. These runners have no CUDA toolkit, and cubecl-cuda
          # enables cudarc's `fallback-latest`, so without this the build
          # silently targets the newest CUDA cudarc knows (13.3) and then looks
          # for `nvrtc64_130_0.dll` — a name no CUDA 12 toolkit ships. The
          # result is not a build failure but a silent CPU fallback on every
          # user's machine, which reads as "training is slow".
          #
          # 12.6 is not this machine's toolkit specifically: every CUDA 12.x
          # release ships `nvrtc64_120_0.dll`, and that is the name cudarc
          # derives from any 12.x value here. Bump only when CUDA 13 toolkits
          # are the common case, since it trades one generation for the other.
          CUDARC_CUDA_VERSION: "12060"
          # Auto-update signing. Generate a keypair once with
          #   npm run tauri signer generate -- -w ~/.tauri/didascalie.key
          # then add these as repository secrets (Settings → Secrets → Actions)
          # and paste the PUBLIC key into src-tauri/tauri.conf.json (plugins.updater.pubkey).
          # With these set, tauri-action signs the installers and publishes a
          # `latest.json` update manifest to the release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: didascalie-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "Didascalie v__VERSION__"
          releaseBody: "Download the installer for your platform from the assets below."
          # Publish directly (not as a draft) so GitHub's /releases/latest — which
          # the updater's endpoint resolves — points at the new version and clients
          # auto-update. A draft is invisible to /releases/latest.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.microscopy.conf.json
