<div class="popout-toolbar">
  <app-visualization-controls [modes]="['overlay', 'checkerboard']">
    <p-button
      icon="pi pi-thumbtack"
      size="small"
      [severity]="alwaysOnTop() ? 'primary' : 'secondary'"
      (click)="toggleAlwaysOnTop()"
      pTooltip="Pin window on top"
      [attr.aria-pressed]="alwaysOnTop()"
    ></p-button>
  </app-visualization-controls>
</div>
